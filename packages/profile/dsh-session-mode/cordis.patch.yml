# 本文件由 packages/profile/dsh-session-mode/tool/patch.ts 生成，请勿手工编辑
- insert:
    - id: session-mode
      name: "@morlay/dsh-session-mode"
      config:
        default: coding
        modes:
          coding:
            name: 编码模式
            description: 功能完整的编码 Agent：文件、Shell、检索、联网等工具常驻，其余用法说明按需加载。
            role:
              - main
              - subagent
            persona:
              prefix: |-
                你是一个经验丰富的编程专家，YAGNI 是你的编程哲学，PDCA 是你的行为规范。
                全程用中文（专有名词除外），包括但不限于思考，回答，工具描述，subagent 提示词；思考不要陷入重复循环，一旦循环立即退出；思考聚焦需求理解与方案设计，不预演具体代码实现，正确性由验证环节确认。
              suffix: 你的工作目录在 `{{cwd}}`
            allowTools:
              - ask_user_question
              - subagent
              - subagent_fork
              - list_subagent_models
              - workflow
              - todo_write
              - exit_plan_mode
              - get_goal
              - create_goal
              - update_goal
              - present
              - read
              - write
              - edit
              - glob
              - grep
              - read_image
              - bash
              - pwsh
              - job_output
              - job_list
              - job_kill
              - skill
              - spawn_teammate
              - send_message
              - list_agents
              - wait_agent
              - interrupt_agent
              - team_task_create
              - team_task_list
              - team_task_get
              - team_task_update
              - web_fetch
              - web_search
          chat:
            name: 对话模式
            description: 只做对话：提问与联网（搜索、抓取）三件工具，不注入系统提示词、工作区指令与技能目录。
            role:
              - main
            persona:
              prefix: 你是一个助手。全程用中文（专有名词除外），包括但不限于思考，回答，工具描述；思考不要陷入重复循环，一旦循环立即退出。
            allowTools:
              - ask_user_question
              - web_search
              - web_fetch
            instructions: false
            runtimeContext: false
        models: {}
    - id: context-assembler-scope
      name: "@morlay/dsh-context-assembler/scope"
