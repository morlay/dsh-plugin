<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Local Build</title>
  </head>
  <body>
    <!-- 容器与上游一致：`#root`（`apps/web/index.html`）。挂载点换名字会让上游按 `#root` 写的样式失效。 -->
    <div id="root"></div>
    <!-- vite 的入口：它自己会把 index.ts 转译、把依赖预打包、并挂上 HMR。
         `@/…` 是"当前 workspace 的文件"的写法（与源码 import 的 alias 同一套），路由把它落到仓库内路径。 -->
    <script type="module" src="@/packages/client/dsh-client-modules/app-boot/index.ts"></script>
  </body>
</html>
