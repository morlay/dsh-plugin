# 源码面的 client 半：`@deepseek-ai/*` 与本仓库插件包的 `exports["./client"]` 都指到 `src/client/index.ts`，
# 而 `client-modules` 只会把那个文件当 JS 原样下发——所以要有人把源码半现场打成模块表的工厂脚本。
# 判据与实现见 [`src/`](../src/index.ts)。
#
# 这一层**只服务 dev 形态**（`dsh-desktopify dev` 用 `--patch` 挂上），所以直接指 TS 源码：
# dev 宿主进程由 `--import @oxc-node/core/register` 转译，不需要先有构建产物。打包形态走的是
# `desktop.cordis.patch.yml`，那份仍指产物（部署里没有源码）。
- insert:
    - id: client-modules
      name: "@morlay/dsh-client-modules"

# `web-runtime` 挂着 `frontend-static`（服务**构建产物**里的 index.html，占兜底位）——dev 形态下页面与资源
# 全归 vite，这一行连同它挂的兜底一起用不到；而且兜底位只有一个，留着它 vite 就没位置可占。
- id: web-runtime
  disabled: true

# 上游这两行在 dev 形态下用不到，**整行停用**（含它们提供的服务）：
# · `client-modules`——combo 打包、工厂引导器、`/plugins` 路由与**模块表 roster**（`modules` 服务）都在
#   这一行。页面、入口、资源与依赖预打包由 vite dev server 提供，模块表那一套不再需要；
# · `client-hmr`——热替换由 vite 的通道接管。
#
# 后果是**有意接受**的：依赖 `modules` 的行（`ui-settings-plugin-inventory` 等）会一直 pending，
# 界面上的「内置插件」视图显示"本部署没有开放任何插件视图"。本部署的插件面由 profile 自己的
# cordis.patch.yml 与 settings namespace 承担，不通过这条模块表。
- id: modules
  disabled: true
- id: client-hmr
  disabled: true
