# 本文件由 packages/preset/dsh-preset/tool/patch.ts 生成，请勿手工编辑
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
- id: agent-preset-registry
  config:
    default: coding
- insert:
    - id: preset-coding
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: coding
        name: 编码模式
        description: 功能完整的编码 Agent：文件、Shell、检索、联网等工具常驻，其余用法说明按需加载。
        order: 1
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是一个经验丰富的编程专家，YAGNI 是你的编程哲学，PDCA 是你的行为规范。
                全程用中文（专有名词除外），包括但不限于思考，回答，工具描述；思考不要陷入重复循环，一旦循环立即退出；思考聚焦需求理解与方案设计，不预演具体代码实现，正确性由验证环节确认。
              suffix: 你的工作目录在 `{{cwd}}`，工作目录内的 AGENTS.md 的规则非常重要，必须严格遵守
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === "win32"
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== "win32"
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: command-goal
            name: "@deepseek-ai/dsh-command-goal"
          - id: tool-goal
            name: "@deepseek-ai/dsh-tool-goal"
          - id: compaction
            name: cordis:group
            group: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
            isolate:
              compaction: true
              toolResultPruner: true
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"
              - id: tool-subagent-list-agents
                name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"
              - id: tool-subagent
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: "@deepseek-ai/dsh-workflow-ptc"
                config:
                  provider: spawn
              - id: tool-workflow
                name: "@deepseek-ai/dsh-tool-workflow"
            isolate:
              workflowEngine: true
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: "@deepseek-ai/dsh-tool-present"
          - id: context-agent-instructions
            name: "@morlay/dsh-context-agent-instructions"
          - id: context-skill-catalog
            name: "@morlay/dsh-context-skill-catalog"
          - id: context-reference
            name: "@morlay/dsh-context-reference"
          - id: context-tool-guidance
            name: "@morlay/dsh-context-tool-guidance"
    - id: preset-chat
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: chat
        name: 对话模式
        description: 只做对话：提问与联网（搜索、抓取）三件工具，不注入系统提示词、工作区指令与技能目录。
        order: 2
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: 你是一个助手。全程用中文（专有名词除外），包括但不限于思考，回答，工具描述；思考不要陷入重复循环，一旦循环立即退出。
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
          - id: context-scope
            name: "@morlay/dsh-context-scope"
            config:
              allowTools:
                - ask_user_question
                - web_search
                - web_fetch
              instructions: false
          - id: context-tool-guidance
            name: "@morlay/dsh-context-tool-guidance"
            config:
              groups: false
- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: OLLAMA_API_KEY
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        reasoning: high
        requestImageMaxBytes: 2097152
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash @ Ollama Cloud
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              "off": null
              low: low
              high: high
              max: max
- id: web
  config:
    searchProvider: ollama
    fetchProvider: http
- id: agent-instructions
  disabled: true
- id: tool-skill
  disabled: true
- id: sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: office-to-pdf
  disabled: true
- insert:
    - id: sandbox-local
      name: "@morlay/dsh-sandbox-local"
      config:
        access: |-
          rw /tmp
          rw {{ env.XDG_CACHE_HOME }}
          rw {{ env.XDG_STATE_HOME }}
          rw {{ env.XDG_DATA_HOME }}
          r- {{ env.XDG_CONFIG_HOME }}
          -- mise.*.toml
          -- **/*.pem
- insert:
    - id: context-assembler
      name: "@morlay/dsh-context-assembler"
- insert:
    - id: web-search-ollama
      name: "@morlay/dsh-web-search-ollama"
      config:
        apiKeyEnv: OLLAMA_API_KEY
