# 本文件由 packages/preset/dsh-preset/tool/patch.ts 生成，请勿手工编辑
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
- id: agent-presets
  config:
    default: standard
    includeShippedRoot: false
    roots:
      - path: !!js |-
          process
                        .getBuiltinModule("node:path")
                        .join(
                          process
                            .getBuiltinModule("node:path")
                            .dirname(
                              process
                                .getBuiltinModule("node:module")
                                .createRequire(ctx.baseUrl)
                                .resolve("@morlay/dsh-preset/package.json"),
                            ),
                          "dist/presets",
                        )
        trust: system
- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: OLLAMA_API_KEY
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        reasoning: high
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash @ Ollama Cloud
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              "off": null
              low: low
              high: high
              max: max
- id: agent-instructions
  disabled: true
- id: tool-skill
  disabled: true
- id: sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: office-to-pdf
  disabled: true
- id: subagent-model-selection-settings
  disabled: true
- insert:
    - id: sandbox-local
      name: "@morlay/dsh-sandbox-local"
      config:
        access: |-
          rw /tmp
          rw {{ env.XDG_CACHE_HOME }}
          rw {{ env.XDG_STATE_HOME }}
          rw {{ env.XDG_DATA_HOME }}
          r- {{ env.XDG_CONFIG_HOME }}
          -- mise.*.toml
          -- **/*.pem
- insert:
    - id: context-assembler
      name: "@morlay/dsh-context-assembler"
