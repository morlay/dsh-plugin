# 本文件由 packages/preset/dsh-preset/tool/patch.ts 生成，请勿手工编辑
- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: OLLAMA_API_KEY
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        reasoning: high
        requestImageMaxBytes: 2097152
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash @ Ollama Cloud
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              "off": null
              low: low
              high: high
              max: max
- id: ui-settings-general
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- insert:
    - id: sandbox-local
      name: "@morlay/dsh-sandbox-local"
      config:
        access: |-
          rw /tmp
          rw {{ env.XDG_CACHE_HOME }}
          rw {{ env.XDG_STATE_HOME }}
          rw {{ env.XDG_DATA_HOME }}
          r- {{ env.XDG_CONFIG_HOME }}
          -- mise.*.toml
          -- **/*.pem
- id: web
  config:
    searchProvider: ollama
    fetchProvider: http
- insert:
    - id: web-search-ollama
      name: "@morlay/dsh-web-search-ollama"
      config:
        apiKeyEnv: OLLAMA_API_KEY
