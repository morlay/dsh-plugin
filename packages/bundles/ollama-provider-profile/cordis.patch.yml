# 本文件由 packages/bundles/ollama-provider-profile/tsdown.config.ts 生成，请勿手工编辑
- insert:
    - id: ui-primitives-fork
      name: "@morlay/dsh-client-ui-primitives"
- insert:
    - id: web-search-ollama
      name: "@morlay/dsh-web-search-ollama"
- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: OLLAMA_API_KEY
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        reasoning: high
        requestImageMaxBytes: 2097152
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash @ Ollama Cloud
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              "off": null
              low: low
              high: high
              max: max
- id: web
  config:
    searchProvider: ollama
    fetchProvider: http
- id: web-search-ollama
  config:
    apiKeyEnv: OLLAMA_API_KEY
