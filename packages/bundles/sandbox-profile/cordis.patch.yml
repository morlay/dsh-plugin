# 本文件由 packages/bundles/sandbox-profile/tsdown.config.ts 生成，请勿手工编辑
- id: sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- insert:
    - id: sandbox-local
      name: "@morlay/dsh-sandbox-local"
- id: sandbox-local
  config:
    access: |-
      rw /tmp
      rw {{ env.XDG_CACHE_HOME }}
      rw {{ env.XDG_STATE_HOME }}
      rw {{ env.XDG_DATA_HOME }}
      r- {{ env.XDG_CONFIG_HOME }}
      -- mise.*.toml
      -- **/*.pem
