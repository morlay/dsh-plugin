# 源码面的 client 半：`@deepseek-ai/*` 与本仓库插件包的 `exports["./client"]` 都指到 `src/client/index.ts`，
# 而 `client-modules` 只会把那个文件当 JS 原样下发——所以要有人把源码半现场打成模块表的工厂脚本。
# 判据与实现见 [`src/`](../src/index.ts)。
#
# 这一层由**两种形态共享**：`dsh-desktopify dev`（web / 桌面）都用 `--patch` 挂它，桌面档还会再叠
# `desktop.cordis.patch.yml`。宿主进程由 `--import @oxc-node/core/register` 转译，所以这里直接指 TS 源码。
- insert:
    - id: client-modules
      name: "@morlay/dsh-client-modules"

# `web-runtime` **保留**：它同时管两件事——挂 `frontend-static`（服务构建产物里的 index.html，占兜底位）
# 与**打印 URL、交接默认浏览器**。以前为"不让兜底位跟 vite 抢"把整行停掉，代价是那两件也一起没了
# （启动后既没有地址行、也不会打开浏览器）。现在留着它：dev 形态下页面仍归 vite，`frontend-static`
# 只在它自己的路由与兜底上存在，两者按注册顺序共存。

# 上游这两行在 dev 形态下用不到，**整行停用**（含它们提供的服务）：
# · `client-modules`——combo 打包、工厂引导器、`/plugins` 路由与**模块表 roster**（`modules` 服务）都在
#   这一行。页面、入口、资源与依赖预打包由 vite dev server 提供，模块表那一套不再需要；
#   **但它对外承诺的 `modules` 服务面要有人接**：上游 `ui-settings-general` 的 client 插件 inject 它
#   （设置入口占位者），缺了服务那一行就不 apply、侧栏左下角的设置入口整个消失——由
#   `@morlay/dsh-client-modules` 的 client 半补上（见该包的 README）；
# · `client-hmr`——热替换由 vite 的通道接管。
#
- id: modules
  disabled: true
- id: client-hmr
  disabled: true

# **插件管理页保留**（`ui-plugin-manager`：它只依赖 `remote.pluginManager*` 那几个 remote 面，
# 不依赖被停用的模块表）；停的只是**设置页里的插件清单**——那两行要 `modules` 服务
# （模块表 roster）与 bundle 清单，模块表已随 `client-modules` 退场，留着只会是空页。
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
