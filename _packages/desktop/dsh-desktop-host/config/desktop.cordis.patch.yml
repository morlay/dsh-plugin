# 桌面形态**不再替换** `webserver`：以前这里禁用它、插一个"无端口替身"，让请求走字节管道喂进来——
# 那样没有 origin（不是真的 `http://host:port`），而基于 URL/WS 的东西（settings 的 `describe` 流、
# 账号的 stream mux、vite 的 HMR）拿不到答复，表现为"设置页永远不可用、连请求都看不到"。
# 现在回到上游的做法：**照常 listen（随机端口）**，壳用它的 origin 载入窗口。
#
# `web-runtime` 的四项一并写全：patch 整块替换 config，没有端口可打印、也没有
# 浏览器可交接；`surfaceContext` 关掉，免得提示段带一个并不存在的 URL。

- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
    trustedHosts: []

# **端口要随机**：`web-app` bundle 给 `webserver` 的默认是 `webStartup.port ?? 3080`，而桌面形态没有
# `--port` 参数，于是落到 3080——同时开两个实例、或本机上别的工具占了它，第二次就起不来。桌面没有
# "可预期的地址"要对外（窗口从 origin 载入，地址由宿主自己报），所以向系统要一个：`0`（上游的
# `webserver` 明确支持："zero requests an OS-assigned port"）。
- id: webserver
  config:
    # `host` 与 `port` 是必填（patch 整块替换 config，写一半就是 `$.host missing required value`）。
    # 只绑回环：桌面不需要对外服务。
    host: "127.0.0.1"
    port: 0

# 桌面档的产品遥测面：上游那两行只在 profile 名为 `desktop` 时激活，靠构建期环境变量 `DSH_CLIENT_VERSION`
# 填 `serviceVersion`（必填）。自研壳不传那个变量，于是遥测行配置校验失败、`product-analytics` 行 pending，
# 页面启动时 `productAnalytics/watchPolicy` 那条流拿 502，前端又在非 JSON 响应上抛未捕获错误。
# 本地桌面部署没有上报对象（endpoint 是官方 collector），两行一起停。
# 决策见 [ADR 桌面档无产品遥测](../.agents/adrs/20261008-桌面档无产品遥测.md)。

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# **本部署不要账号 UI**：上游 `ui-settings-account` 那一行渲染设置页的账号页、侧栏账号菜单与首次引导层。
# 它同时还是那个 **settings namespace 的 owner**——光停它，前端镜面就拿不到名册（`describeFace.view
# === undefined`）→ 直接 failLoad，整个设置页判 "settings are unavailable in this browser"，连
# `/api/settings` 都不请求。所以停它的同时，由下面那行**顶上同一个注册**（不渲染任何界面）。
#
# **为什么停用必须写在这里**：实测，写在 bundle 层的停用会被后来应用的层盖回去；这份 overlay 由宿主追加在
# `patchFiles` 末尾（`src/index.ts:80`），是最后应用的一层。

- id: ui-settings-account
  disabled: true

# 顶替上面那行不可省的那件事：注册 settings namespace（同样的 `settings.configure({ auto: false })`，
# 不渲染账号页/侧栏菜单/引导层）。实现见 [`../src/settings-namespace.ts`](../src/settings-namespace.ts)。

- insert:
    - id: settings-namespace
      name: "../src/settings-namespace.ts"
