packages:
  - vendor/deepseek-harness/vendor/*
  - vendor/deepseek-harness/packages/*/*
  - vendor/deepseek-harness/native/system
  - vendor/deepseek-harness/native/system/packages/*
  - vendor/deepseek-harness/apps/*
  - devpackages/*
  - packages/*/*
  - apps/*

# 开发时 workspace 依赖走链接：改源码立即生效，不必重装。
#
# **打包不受它影响**：`dshdev` 的 deploy 步骤用 `--config.inject-workspace-packages=true` 覆盖它——deploy
# 要的是"按内容装进去"的自包含闭包（链接指回仓库，换机器就断）。别在 deploy 之后再加"补装/逐个实体化"
# 那类步骤：pnpm 原生一次就做完了（见 `devpackages/dshdev/src/cli/prepare-seed.ts` 的 `deployClosure`）。
linkWorkspacePackages: true
hoistWorkspacePackages: true
autoInstallPeers: true

# 所有 node 进程（含 tsdown 加载 config、脚本直跑 TS）自动挂 oxc 的注册钩子：TS loader 这件事
# 从此只有这一处，不需要各处写 `--import`，也不需要 tsx。
nodeOptions: "--import @morlay/dsh-oxc-node"

# 安装脚本白名单：与上游清单对齐（true = 放行，false = 明确拒绝但允许安装），再补上本仓库部署需要的
# （桌面壳要 electron 的二进制、沙箱与 PTY 要各自的原生件）。上游用 false 表达"评估过、不需要它的脚本"，
# 这个信息同样要带过来——漏掉就是 pnpm 10+ 的硬错误。
allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@deepseek-ai/dsh-subprocess-local@file:vendor/deepseek-harness/packages/subprocess/subprocess-local": true
  "@google/genai": false
  electron: true
  electron-winstaller: false
  esbuild: true
  fs-ext: true
  koffi: true
  lefthook: true
  msgpackr-extract: false
  node-addon-require-builtin: false
  node-pty: true
  pnpm: true
  protobufjs: false

minimumReleaseAge: 0

# 上游对第三方依赖的补丁（文件在 vendor 内，随上游提交一起换版）：
# 同一个依赖我们与上游只应有一份实现，所以照抄上游的补丁清单，而不是各自绕行。
# 例外：`@yao-pkg/pkg` 只被上游**根** package.json 的单文件 exe 打包用（本仓库不装它的 devDeps、
# 桌面走自研打包器），补丁在这里永远匹配不到实体——留着就是 `ERR_PNPM_UNUSED_PATCH`。
patchedDependencies:
  "@botiverse/oar@0.67.0": vendor/deepseek-harness/patches/@botiverse__oar@0.67.0.patch
  "@earendil-works/pi-ai@1.3.0": vendor/deepseek-harness/patches/@earendil-works__pi-ai@1.3.0.patch
  "@electron/osx-sign@1.3.3": vendor/deepseek-harness/patches/@electron__osx-sign@1.3.3.patch
  "@fortune-sheet/core@1.0.4": vendor/deepseek-harness/patches/@fortune-sheet__core@1.0.4.patch
  "@fortune-sheet/react@1.0.4": vendor/deepseek-harness/patches/@fortune-sheet__react@1.0.4.patch
  app-builder-lib@26.17.0: vendor/deepseek-harness/patches/app-builder-lib@26.17.0.patch
  exceljs@4.4.0: vendor/deepseek-harness/patches/exceljs@4.4.0.patch
  lexical@0.49.0: vendor/deepseek-harness/patches/lexical@0.49.0.patch
  mdast-util-gfm-autolink-literal@2.0.1: vendor/deepseek-harness/patches/mdast-util-gfm-autolink-literal@2.0.1.patch
  micromark-extension-gfm-autolink-literal@2.1.0: vendor/deepseek-harness/patches/micromark-extension-gfm-autolink-literal@2.1.0.patch
  node-pty@1.2.0-beta.15: vendor/deepseek-harness/patches/node-pty@1.2.0-beta.15.patch

overrides:
  "typescript": "7.1.0-beta"
  # 构建链只认一份 rolldown：tsdown 0.23.5 与 vite 8 都钉 `~1.2.16`，而根与各 devpackage 写的
  # `1.x` / `^1.2.8` 会解析到 1.3.0——两套 `Plugin` 类型互不兼容，`just lint` 在
  # `tsdown-plugin-cordis` 报 TS2322 / TS2321（插件数组赋不进 `TsdownPluginOption`）。
  rolldown: "1.2.16"
  # Electron 全仓一个版本：上游 `apps/desktop` 声明 `^44.7.0`（它被 `node-addon-require-builtin@0.1.9`
  # 的 Electron 44.7 V8 指纹钉住，见其 `pnpm-workspace.yaml` 的 `minimumReleaseAgeExclude`）。桌面宿主
  # 跑在 Electron 的 node 上，所以这个升级必须只解析出一份 Electron——上游那份也一起抬。
  electron: "45.x"
  react: "18.x"
  react-dom: "18.x"
  # 类型与运行时一起只留一份：根写的精确 18.3.1 与 vendor 包写的 `~18.3.1` / `~18.3.0`
  # （18.3.31 / 18.3.7）必须解析到同一版本——vendor 已并入根 workspace、共用一个 store
  # （见 `vendor/steps.ts` 删掉它自带的 pnpm-workspace.yaml），同版本即同一物理目录；
  # 两份 `@types/react` 时 TS7 的 declaration emit 会报 TS2883（无法命名）并跳过该文件的声明。
  "@types/react": "18.3.31"
  "@types/react-dom": "18.3.7"
  # 上游把 vendor 里的 cordis 依赖两件收成源码副本（其 overrides 写的是相对它自己 workspace 根的
  # `link:vendor/*`）；本仓库根是上一级，路径要多带一层目录。
  "@deepseek-ai/cosmokit": "link:vendor/deepseek-harness/vendor/cosmokit"
  "@deepseek-ai/schemastery": "link:vendor/deepseek-harness/vendor/schemastery"
  # 上游靠 minimumReleaseAge 政策把 pi-ai / lexical / pkg 这些钉在打补丁的精确版本（见其
  # minimumReleaseAgeExclude）；我们关掉了该政策（`minimumReleaseAge: 0`），所以自己钉版本——
  # 否则 patch 打不到解析结果上（pnpm 直接报未使用）。
  "@earendil-works/pi-ai": "1.3.0"
  lexical: "0.49.0"
