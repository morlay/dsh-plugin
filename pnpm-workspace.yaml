packages:
  - vendor/deepseek-harness/vendor/*
  - vendor/deepseek-harness/packages/*/*
  - vendor/deepseek-harness/native/system
  - vendor/deepseek-harness/native/system/packages/*
  - vendor/deepseek-harness/apps/*
  - devpackages/*
  - packages/*/*
  - apps/*

# 开发时 workspace 依赖走链接：改源码立即生效，不必重装。
#
# 要的是"按内容装进去"的自包含闭包（链接指回仓库，换机器就断）。别在 deploy 之后再加"补装/逐个实体化"
# 那类步骤：pnpm 原生一次就做完了（见 `devpackages/dshdev/src/cli/prepare-seed.ts` 的 `deployClosure`）。
linkWorkspacePackages: true
hoistWorkspacePackages: true
autoInstallPeers: true

# 所有 node 进程（含 tsdown 加载 config、脚本直跑 TS）自动挂 oxc 的注册钩子：TS loader 这件事
# 从此只有这一处，不需要各处写 `--import`，也不需要 tsx。
nodeOptions: "--import @oxc-node/core/register"

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@deepseek-ai/dsh-subprocess-local@file:vendor/deepseek-harness/packages/subprocess/subprocess-local": true
  "@google/genai": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-ext: true
  koffi: true
  msgpackr-extract: true
  node-pty: true
  pnpm: true
  protobufjs: true

minimumReleaseAge: 0

# 上游对第三方依赖的补丁（文件在 vendor 内，随 DEEPSEEK_HARNESS_VERSION 一起换版）：
# 同一个依赖我们与上游只应有一份实现，所以照抄上游的补丁清单，而不是各自绕行。
patchedDependencies:
  "@earendil-works/pi-ai@1.3.0": vendor/deepseek-harness/patches/@earendil-works__pi-ai@1.3.0.patch
  "@electron/osx-sign@1.3.3": vendor/deepseek-harness/patches/@electron__osx-sign@1.3.3.patch
  "@fortune-sheet/core@1.0.4": vendor/deepseek-harness/patches/@fortune-sheet__core@1.0.4.patch
  "@fortune-sheet/react@1.0.4": vendor/deepseek-harness/patches/@fortune-sheet__react@1.0.4.patch
  exceljs@4.4.0: vendor/deepseek-harness/patches/exceljs@4.4.0.patch
  node-pty@1.2.0-beta.15: vendor/deepseek-harness/patches/node-pty@1.2.0-beta.15.patch

overrides:
  react: "18.x"
  react-dom: "18.x"
  "@earendil-works/pi-ai": "1.3.0"
