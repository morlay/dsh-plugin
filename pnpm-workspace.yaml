packages:
  - vendor/deepseek-harness/vendor/*
  - vendor/deepseek-harness/packages/*/*
  - vendor/deepseek-harness/native/system
  - vendor/deepseek-harness/native/system/packages/*
  - devpackages/*
  - packages/*/*
  - apps/*

# 开发时 workspace 依赖走链接：改源码立即生效，不必重装。
#
# 要的是"按内容装进去"的自包含闭包（链接指回仓库，换机器就断）。别在 deploy 之后再加"补装/逐个实体化"
# 那类步骤：pnpm 原生一次就做完了（见 `packages/zephyr/zephyr-cli/src/build/builder.ts` 的 `pnpm deploy --prod`）。
linkWorkspacePackages: true
hoistWorkspacePackages: true
autoInstallPeers: true

# 所有 node 进程（含 tsdown 加载 config、脚本直跑 TS）自动挂 oxc 的注册钩子：TS loader 这件事
# 从此只有这一处，不需要各处写 `--import`，也不需要 tsx。
nodeOptions: "--import @oxc-node/core/register"

# `@morlay` 这个 scope 默认指向**本地模拟 registry**（`tool/npr` 的 verdaccio，宿主机 7677）：
# 手滑跑一条 `pnpm publish` 也只会发到本机，不会碰到真 registry。
#
# **必须写在 workspace 里**：本机 `~/.npmrc` 有 `@morlay:registry=https://registry.npmjs.org/`，
# scope 级映射会盖掉命令行 `--registry`（pnpm 12 实测）——不声明的话，指向本地的发布会被悄悄送到 npmjs。
# 真要发 npmjs 时由 `just publish-npm --registry https://registry.npmjs.org/` 里的
# `--config.@morlay:registry=<url>` 逐次覆盖（见 devpackages/devkit/src/release/publish.ts）。
registries:
  http://127.0.0.1:7677/:
    scopes: ["@morlay"]

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@deepseek-ai/dsh-subprocess-local@file:vendor/deepseek-harness/packages/subprocess/subprocess-local": true
  "@google/genai": true
  # 上游 0.2.3 新增的 connector（feishu / tencent-meeting）带的 CLI：postinstall 取平台二进制
  # （lark-cli 从 GitHub release 下载、tmeet 只清理临时文件）。本仓装配不挂这两个 connector，
  # 但安装期它们仍要被批准，否则 pnpm 以 ERR_PNPM_IGNORED_BUILDS 拒装。
  "@larksuite/cli": true
  "@tencentcloud/tmeet": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-ext: true
  koffi: true
  msgpackr-extract: true
  node-pty: true
  pnpm: true
  protobufjs: true

minimumReleaseAge: 0

# 上游对第三方依赖的补丁（文件在 vendor 内，随 DEEPSEEK_HARNESS_VERSION 一起换版）：
# 同一个依赖我们与上游只应有一份实现，所以照抄上游的补丁清单，而不是各自绕行。
patchedDependencies:
  "@earendil-works/pi-ai@1.3.0": vendor/deepseek-harness/patches/@earendil-works__pi-ai@1.3.0.patch
  "@fortune-sheet/core@1.0.4": vendor/deepseek-harness/patches/@fortune-sheet__core@1.0.4.patch
  "@fortune-sheet/react@1.0.4": vendor/deepseek-harness/patches/@fortune-sheet__react@1.0.4.patch
  exceljs@4.4.0: vendor/deepseek-harness/patches/exceljs@4.4.0.patch
  node-pty@1.2.0-beta.15: vendor/deepseek-harness/patches/node-pty@1.2.0-beta.15.patch

overrides:
  "typescript": "7.1.0-beta"
  react: "18.x"
  react-dom: "18.x"
  # 对齐上游：vendor 里 80 处声明全部精确钉在 4.6.6，范围收成同一个串才不会并存两份实例。
  # 上游 @deepseek-ai/dsh-storage-domain 的 ZodType 类型面认的是 4.6.6 那份，
  # 本仓解析到 4.6.7 时「拿自己的 zod 造 schema 交给上游域层」会结构类型对不上。
  zod: "4.6.6"
  "@earendil-works/pi-ai": "1.3.0"
